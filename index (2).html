<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주사위 확률 게임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Jua', sans-serif; background: #e2e8f0; color: #1e3a8a; }
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="flex flex-col items-center py-8 px-4 min-h-screen">

    <div id="login-section" class="w-full max-w-sm bg-white p-8 rounded-3xl shadow-xl mt-10">
        <h1 class="text-3xl font-bold text-center mb-6 text-indigo-900">🎲 게임 방 입장</h1>
        <input type="text" id="pin-input" class="w-full px-4 py-3 mb-4 rounded-xl border-2 border-gray-300 text-2xl text-center" placeholder="PIN 번호 (예: 1234)">
        <input type="text" id="name-input" class="w-full px-4 py-3 mb-6 rounded-xl border-2 border-gray-300 text-xl text-center" placeholder="내 이름">
        <button id="btn-join" class="w-full bg-blue-600 hover:bg-blue-500 text-white text-2xl py-4 rounded-xl font-bold shadow-lg">입장하기</button>
    </div>

    <div id="game-section" class="hidden flex-col items-center w-full max-w-lg">
        <div class="flex justify-between w-full mb-4 px-2">
            <div class="text-lg bg-indigo-100 px-4 py-1.5 rounded-xl">참여자: <span id="display-name" class="font-bold"></span></div>
            <div class="text-lg bg-yellow-100 px-4 py-1.5 rounded-xl border border-yellow-300">잔액: <span id="current-balance" class="font-bold text-red-500 text-xl">1,000,000</span>원</div>
        </div>

        <div class="bg-white rounded-3xl shadow-lg p-5 w-full flex flex-col items-center mb-4 border border-slate-200">
            <div id="status-message" class="text-xl font-bold text-blue-600 mb-2">베팅을 진행해주세요!</div>
            <div class="text-3xl font-bold text-indigo-900 bg-slate-100 px-6 py-3 rounded-2xl w-full text-center">
                최근 주사위 결과: <span id="last-roll-display" class="text-pink-500">없음</span>
            </div>
        </div>

        <!-- 베팅 영역 -->
        <div id="betting-area" class="w-full grid grid-cols-2 gap-3 mb-6">
            <!-- 자바스크립트로 생성됨 -->
        </div>

        <button id="btn-submit-bets" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-2xl py-4 rounded-xl font-bold shadow-lg transition-all">
            베팅 제출하기
        </button>
    </div>

    <!-- 라운드 결과 확인 모달 -->
    <div id="result-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-[2rem] p-10 max-w-sm w-full shadow-2xl text-center flex flex-col items-center">
            <h2 class="text-3xl font-bold text-indigo-900 mb-6">🎲 주사위 결과</h2>
            <div class="text-5xl font-bold text-pink-500 mb-6" id="modal-dice-result">? + ? = ?</div>
            
            <div class="w-full bg-indigo-50 rounded-xl p-4 mb-6 border border-indigo-100">
                <div class="text-gray-600 mb-1">이번 라운드 당첨금</div>
                <div class="text-4xl font-bold text-blue-600" id="modal-win-amount">0원</div>
            </div>

            <button id="btn-confirm-result" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-4 rounded-xl font-bold text-2xl shadow-md transition-all">
                확인 및 다음 준비
            </button>
        </div>
    </div>

    <!-- 확률 퀴즈 모달 -->
    <div id="quiz-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-[2rem] p-8 max-w-sm w-full shadow-2xl text-center">
            <h2 id="quiz-sum-title" class="text-2xl font-bold text-indigo-900 mb-2">합 ? 확률 맞추기</h2>
            <p class="text-gray-600 mb-6 text-sm">확률을 (분자/분모) 형식으로 적어주세요.<br>예: <span class="font-bold text-red-500">1/36</span></p>
            
            <input type="text" id="quiz-input" class="w-full px-4 py-3 mb-6 rounded-xl border-2 border-indigo-200 text-2xl text-center focus:outline-none focus:border-indigo-500" placeholder="?/?">
            
            <div class="flex gap-3">
                <button onclick="document.getElementById('quiz-modal').classList.add('hidden')" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 py-3 rounded-xl font-bold text-lg">취소</button>
                <button id="btn-submit-quiz" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-xl font-bold text-lg">정답 확인</button>
            </div>
        </div>
    </div>

    <!-- 상금 슬롯머신(룰렛) 모달 -->
    <div id="slot-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-[2rem] p-10 max-w-sm w-full shadow-2xl text-center flex flex-col items-center border-4 border-yellow-400">
            <h2 class="text-3xl font-bold text-indigo-900 mb-2">🎉 정답! 상금 룰렛</h2>
            <p class="text-gray-500 mb-8">두구두구두구...</p>
            
            <div class="w-full bg-slate-900 rounded-2xl p-6 mb-8 border-4 border-slate-700 shadow-inner overflow-hidden">
                <div id="slot-text" class="text-5xl font-bold text-yellow-400 tracking-widest drop-shadow-[0_0_10px_rgba(250,204,21,0.8)]">
                    대기중
                </div>
            </div>

            <button id="btn-close-slot" onclick="document.getElementById('slot-modal').classList.add('hidden')" class="hidden w-full bg-yellow-400 hover:bg-yellow-300 text-yellow-900 py-4 rounded-xl font-bold text-2xl shadow-md transition-all">
                상금 받기
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, get, set, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCYtAU4RvtZWYZcQZPwQ-oINJCxL6l4dR0",
            authDomain: "dice-game-b692a.firebaseapp.com",
            databaseURL: "https://dice-game-b692a-default-rtdb.firebaseio.com",
            projectId: "dice-game-b692a",
            storageBucket: "dice-game-b692a.firebasestorage.app",
            messagingSenderId: "1050517273026",
            appId: "1:1050517273026:web:34a8dc042093c4d56cbe5b",
            measurementId: "G-G0192FW3ER"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let roomPin = "", playerName = "", myBalance = 1000000;
        let myQuizzes = {}; 
        let currentQuizSum = null;

        const multipliers = { 2:18, 3:9, 4:6, 5:4.5, 6:3.6, 7:3, 8:3.6, 9:4.5, 10:6, 11:9, 12:18 };
        const quizAnswers = {
            2: ["1/36"], 3: ["2/36", "1/18"], 4: ["3/36", "1/12"],
            5: ["4/36", "1/9"], 6: ["5/36"], 7: ["6/36", "1/6"],
            8: ["5/36"], 9: ["4/36", "1/9"], 10: ["3/36", "1/12"],
            11: ["2/36", "1/18"], 12: ["1/36"]
        };

        const bettingArea = document.getElementById('betting-area');
        const resultModal = document.getElementById('result-modal');

        Object.keys(multipliers).forEach(sum => {
            const div = document.createElement('div');
            div.className = "bg-white p-3 rounded-xl shadow-sm border border-gray-200 flex flex-col";
            div.innerHTML = `
                <div class="flex justify-between items-center w-full mb-2 px-1">
                    <div class="font-bold text-lg flex items-center gap-1 flex-wrap">
                        <span>합 ${sum}</span>
                        <span class="text-lg text-red-500">(${multipliers[sum]}배)</span>
                        <span id="prob-display-${sum}" class="text-sm font-bold text-blue-600 hidden ml-1">확률: ${quizAnswers[sum][0]}</span>
                    </div>
                    <button class="quiz-btn bg-indigo-500 hover:bg-indigo-400 text-white text-sm font-bold px-2 py-1.5 rounded-md transition-colors whitespace-nowrap ml-2" data-sum="${sum}">❓ 퀴즈</button>
                </div>
                <input type="number" data-sum="${sum}" class="bet-input w-full px-2 py-2 border rounded bg-slate-50 text-center font-bold text-lg" placeholder="금액 입력" min="0">
            `;
            bettingArea.appendChild(div);
        });

        const totalDiv = document.createElement('div');
        totalDiv.className = "bg-indigo-50 p-3 rounded-xl shadow-sm border border-indigo-200 flex flex-col items-center justify-center";
        totalDiv.innerHTML = `
            <div class="font-bold text-lg mb-1 text-indigo-900">총 베팅 금액</div>
            <div id="live-total-bet" class="text-2xl font-bold text-blue-600">0원</div>
        `;
        bettingArea.appendChild(totalDiv);

        const betInputs = document.querySelectorAll('.bet-input');
        const liveTotalBetEl = document.getElementById('live-total-bet');

        betInputs.forEach(input => {
            input.addEventListener('input', () => {
                let currentTotal = 0;
                betInputs.forEach(inp => {
                    const val = parseInt(inp.value) || 0;
                    if (val > 0) currentTotal += val;
                });
                liveTotalBetEl.textContent = currentTotal.toLocaleString() + '원';

                if (currentTotal > myBalance) {
                    liveTotalBetEl.classList.replace('text-blue-600', 'text-red-600');
                } else {
                    liveTotalBetEl.classList.replace('text-red-600', 'text-blue-600');
                }
            });
        });

        document.querySelectorAll('.quiz-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const sum = e.target.dataset.sum;
                if (myQuizzes[sum]) return alert('이미 정답을 맞춰 보상을 받은 퀴즈입니다.');
                
                currentQuizSum = sum;
                document.getElementById('quiz-sum-title').textContent = `주사위 합 ${sum} 확률 맞추기`;
                document.getElementById('quiz-input').value = '';
                document.getElementById('quiz-modal').classList.remove('hidden');
            });
        });

        document.getElementById('btn-submit-quiz').addEventListener('click', () => {
            const ans = document.getElementById('quiz-input').value.replace(/\s/g, ''); 
            const correctAns = quizAnswers[currentQuizSum];
            
            if (correctAns.includes(ans)) {
                document.getElementById('quiz-modal').classList.add('hidden');
                startSlotMachine();
            } else {
                alert('틀렸습니다! 다시 한 번 고민해보세요.\n(힌트: 주사위 2개를 굴렸을 때 나올 수 있는 전체 경우의 수는 36가지입니다.)');
            }
        });

        function startSlotMachine() {
            const slotModal = document.getElementById('slot-modal');
            const slotText = document.getElementById('slot-text');
            const btnCloseSlot = document.getElementById('btn-close-slot');
            
            slotModal.classList.remove('hidden');
            btnCloseSlot.classList.add('hidden');

            const texts = ["💥 꽝", "💸 1만원", "💰 2만원", "💎 5만원", "👑 10만원"];
            const rand = Math.random() * 20; 
            let winPrize = 0, prizeIdx = 0;

            if (rand < 2) { winPrize = 0; prizeIdx = 0; }               
            else if (rand < 12) { winPrize = 10000; prizeIdx = 1; }     
            else if (rand < 17) { winPrize = 20000; prizeIdx = 2; }     
            else if (rand < 19) { winPrize = 50000; prizeIdx = 3; }     
            else { winPrize = 100000; prizeIdx = 4; }                   

            let ticks = 0;
            const interval = setInterval(() => {
                slotText.textContent = texts[ticks % texts.length];
                ticks++;
                
                if (ticks > 25) { 
                    clearInterval(interval);
                    slotText.textContent = texts[prizeIdx];
                    
                    update(ref(db, `dice_rooms/${roomPin}/players/${playerName}`), {
                        balance: myBalance + winPrize,
                        [`quizzes/${currentQuizSum}`]: true
                    });
                    
                    btnCloseSlot.classList.remove('hidden');
                }
            }, 50);
        }

        document.getElementById('btn-join').addEventListener('click', async () => {
            roomPin = document.getElementById('pin-input').value.trim();
            playerName = document.getElementById('name-input').value.trim();
            if (!roomPin || !playerName) return alert("PIN 번호와 이름을 입력하세요.");

            const snapshot = await get(ref(db, `dice_rooms/${roomPin}`));
            if (!snapshot.exists()) return alert("방이 존재하지 않습니다.");

            await set(ref(db, `dice_rooms/${roomPin}/players/${playerName}`), {
                name: playerName, balance: 1000000, status: 'waiting', lastWin: 0, quizzes: {}
            });

            document.getElementById('display-name').textContent = playerName;
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('game-section').classList.remove('hidden');
            document.getElementById('game-section').classList.add('flex');

            onValue(ref(db, `dice_rooms/${roomPin}`), (data) => {
                const room = data.val();
                
                if (!room || !room.players || !room.players[playerName]) {
                    alert("관리자에 의해 방에서 강제 퇴장되었거나 방이 삭제되었습니다.");
                    window.location.reload();
                    return;
                }
                
                const myData = room.players[playerName];
                myBalance = myData.balance;
                myQuizzes = myData.quizzes || {};
                
                document.getElementById('current-balance').textContent = myBalance.toLocaleString();

                document.querySelectorAll('.quiz-btn').forEach(btn => {
                    const s = btn.dataset.sum;
                    const probDisplay = document.getElementById(`prob-display-${s}`);
                    if (myQuizzes[s]) {
                        btn.textContent = '완료';
                        btn.classList.replace('bg-indigo-500', 'bg-gray-400');
                        btn.classList.replace('hover:bg-indigo-400', 'hover:bg-gray-400');
                        btn.disabled = true;
                        probDisplay.classList.remove('hidden'); 
                    } else {
                        btn.textContent = '❓ 퀴즈';
                        btn.classList.replace('bg-gray-400', 'bg-indigo-500');
                        btn.classList.replace('hover:bg-gray-400', 'hover:bg-indigo-400');
                        btn.disabled = false;
                        probDisplay.classList.add('hidden');
                    }
                });

                if (room.lastRoll) {
                    document.getElementById('last-roll-display').textContent = `${room.lastRoll.d1} + ${room.lastRoll.d2} = ${room.lastRoll.sum}`;
                } else {
                    document.getElementById('last-roll-display').textContent = "없음";
                }

                // 💡 [수정] 제출했거나, 결과창을 보고 있을 때 사용자가 베팅했던 금액을 그대로 채워 넣어줌
                if (myData.bets) {
                    betInputs.forEach(i => {
                        const s = i.dataset.sum;
                        i.value = myData.bets[s] || '';
                    });
                } else if (myData.status === 'waiting' || myBalance <= 0) {
                    // 대기 상태이거나 파산했다면 입력창을 비움
                    betInputs.forEach(i => i.value = '');
                }

                // 금액이 채워졌다면 총합을 다시 계산해서 화면에 반영
                if (betInputs.length > 0) {
                    betInputs[0].dispatchEvent(new Event('input'));
                }

                if (myData.status === 'show_result') {
                    document.getElementById('modal-dice-result').textContent = `${room.lastRoll.d1} + ${room.lastRoll.d2} = ${room.lastRoll.sum}`;
                    document.getElementById('modal-win-amount').textContent = `${(myData.lastWin || 0).toLocaleString()}원`;
                    resultModal.classList.remove('hidden');
                    disableBetting();
                } else {
                    resultModal.classList.add('hidden'); 
                    
                    if (myBalance <= 0) {
                        document.getElementById('status-message').textContent = "💥 파산했습니다.";
                        document.getElementById('status-message').className = "text-xl font-bold text-red-600 mb-2";
                        disableBetting();
                    } else if (myData.status === 'submitted') {
                        document.getElementById('status-message').textContent = "⏳ 관리자가 주사위를 굴릴 때까지 대기하세요.";
                        document.getElementById('status-message').className = "text-xl font-bold text-orange-500 mb-2";
                        disableBetting();
                    } else {
                        document.getElementById('status-message').textContent = "🎲 베팅을 진행해주세요!";
                        document.getElementById('status-message').className = "text-xl font-bold text-blue-600 mb-2";
                        enableBetting();
                    }
                }
            });
        });

        document.getElementById('btn-confirm-result').addEventListener('click', async () => {
            // 학생이 '확인' 버튼을 누르면 다음 라운드를 위해 베팅 정보를 비우고 대기 상태로 전환
            await update(ref(db, `dice_rooms/${roomPin}/players/${playerName}`), {
                status: 'waiting',
                bets: null
            });
        });

        document.getElementById('btn-submit-bets').addEventListener('click', async () => {
            let totalBet = 0;
            const bets = {};
            betInputs.forEach(input => {
                const val = parseInt(input.value) || 0;
                if (val > 0) {
                    totalBet += val;
                    bets[input.dataset.sum] = val;
                }
            });

            if (totalBet === 0) return alert("베팅할 금액을 입력해주세요.");
            if (totalBet > myBalance) return alert(`잔액이 부족합니다. (현재 잔액: ${myBalance}원)`);

            await update(ref(db, `dice_rooms/${roomPin}/players/${playerName}`), {
                balance: myBalance - totalBet,
                bets: bets,
                status: 'submitted'
            });
        });

        // 💡 [수정] 입력값을 임의로 지우지 않도록 i.value = '' 코드를 제거했습니다.
        function disableBetting() {
            betInputs.forEach(i => { i.disabled = true; });
            document.getElementById('btn-submit-bets').disabled = true;
            document.getElementById('btn-submit-bets').classList.add('opacity-50', 'cursor-not-allowed');
        }

        function enableBetting() {
            betInputs.forEach(i => i.disabled = false);
            document.getElementById('btn-submit-bets').disabled = false;
            document.getElementById('btn-submit-bets').classList.remove('opacity-50', 'cursor-not-allowed');
        }
    </script>
</body>
</html>
